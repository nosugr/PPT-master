<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1280" height="720" viewBox="0 0 1280 720">
<rect x="0" y="0" width="1280" height="720" fill="none"/>
<!-- Corner triangles -->
<g id="corner-tl" transform="rotate(90 135.7 135.63)">
<polygon points="0.07,-0.07 0.07,271.33 271.33,271.33" fill="#324274" stroke="none"/>
</g>
<g id="corner-bl">
<polygon points="0.13,448.6 0.13,720 271.4,720" fill="#324274" stroke="none"/>
</g>
<g id="corner-tr" transform="rotate(180 1144.37 135.57)">
<polygon points="1008.73,-0.13 1008.73,271.27 1280,271.27" fill="#324274" stroke="none"/>
</g>
<g id="corner-br" transform="rotate(270 1144.3 584.37)">
<polygon points="1008.67,448.67 1008.67,720.07 1279.93,720.07" fill="#324274" stroke="none"/>
</g>
<!-- Inner frame -->
<rect x="25.8" y="23.4" width="1228.4" height="673.2" fill="#FFFFFF" stroke="#324274" stroke-width="1"/>
<!-- Logo -->
<image href="assets/image1.png" x="563.47" y="90.07" width="153.13" height="153.13" preserveAspectRatio="none"/>
<!-- Subtitle -->
<text x="640" y="306.87" text-anchor="middle" font-family="MiSans Normal, sans-serif" font-size="58.67" fill="#324274" font-weight="bold">{{SUBTITLE}}</text>
<!-- Title -->
<text x="640" y="395.4" text-anchor="middle" font-family="MiSans Normal, sans-serif" font-size="80" fill="#324274" font-weight="bold">{{TITLE}}</text>
<!-- English subtitle -->
<text x="640" y="463.93" text-anchor="middle" font-family="MiSans Normal, sans-serif" font-size="24" fill="#324274" font-style="italic">{{ENGLISH_SUBTITLE}}</text>
<!-- Presenter bar -->
<rect x="347.2" y="531.67" width="216.27" height="52.6" fill="#324274" stroke="none"/>
<text x="455.33" y="563.97" text-anchor="middle" font-family="MiSans Normal, sans-serif" font-size="24" fill="#000000">{{PRESENTER}}</text>
<!-- Advisor bar -->
<rect x="716.6" y="531.67" width="203.47" height="52.6" fill="#324274" stroke="none"/>
<text x="818.33" y="563.97" text-anchor="middle" font-family="MiSans Normal, sans-serif" font-size="24" fill="#000000">{{ADVISOR}}</text>
</svg>