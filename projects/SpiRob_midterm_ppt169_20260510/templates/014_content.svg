<text x="642.47" y="395.67" font-family="MiSans Normal, sans-serif" font-size="18.67" fill="#0D0D0D">{{STEP_02_TEXT}}</text>
<rect x="559.8" y="506.47" width="557.47" height="80.73" rx="13.46" ry="13.46" fill="none" stroke="#324274" stroke-width="1"/>
